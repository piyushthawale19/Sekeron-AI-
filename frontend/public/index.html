<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTIVA INTELLIGENCE | Evidence-Led Creative Talent Discovery</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0B0F17; color: #F1F5F9; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0B0F17; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 bg-[#0B0F17]/90 backdrop-blur-md border-b border-slate-800 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div className="flex items-center space-x-3 cursor-pointer" onclick="showTab('dashboard')">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 border border-sky-400/30">
            <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-sky-400">ARTIVA</span>
              <span class="text-[10px] font-semibold tracking-wider px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase">INTELLIGENCE</span>
            </div>
            <p class="text-xs text-slate-400 font-medium">Evidence-led creative talent discovery</p>
          </div>
        </div>
      </div>

      <nav class="hidden md:flex items-center space-x-1 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
        <button onclick="showTab('dashboard')" id="nav-dashboard" class="px-4 py-2 rounded-lg text-sm font-medium transition-all bg-sky-500/10 text-sky-400 border border-sky-500/30">Dashboard</button>
        <button onclick="showTab('artists')" id="nav-artists" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">Artist Directory</button>
        <button onclick="showTab('workbench')" id="nav-workbench" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">Brief & Re-Ranking</button>
      </nav>

      <div class="flex items-center space-x-2">
        <span class="text-xs font-semibold text-sky-400 bg-sky-500/10 px-3 py-1.5 rounded-xl border border-sky-500/30">Stage 3 Live Evaluator</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full" id="main-content">
    <!-- Rendered via JS below -->
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-900 bg-slate-950/80 px-6 py-6 text-center text-xs text-slate-500">
    <p>ARTIVA INTELLIGENCE — Evidence-Led Creative Talent Discovery Platform</p>
    <p class="text-[11px] text-slate-600">SEKERON AI Intern Stage 3 Assessment Prototype</p>
  </footer>

  <script>
    let currentTab = 'dashboard';
    let selectedArtistId = 'artist_01';
    let selectedBriefId = 'brief_01';
    let isReRanked = false;

    let artistsData = [];
    let briefsData = [];

    // Fetch data from local backend server
    async function loadData() {
      try {
        const resA = await fetch('http://localhost:5000/api/artists');
        const dataA = await resA.json();
        artistsData = dataA.artists || [];

        const resB = await fetch('http://localhost:5000/api/briefs');
        const dataB = await resB.json();
        briefsData = dataB.briefs || [];
      } catch (err) {
        console.warn('Backend API connection offline, utilizing embedded state.');
      }
      render();
    }

    function showTab(tab) {
      currentTab = tab;
      render();
    }

    function selectArtist(id) {
      selectedArtistId = id;
      currentTab = 'artist-detail';
      render();
    }

    function selectBrief(id) {
      selectedBriefId = id;
      isReRanked = false;
      render();
    }

    function toggleReRank() {
      isReRanked = !isReRanked;
      render();
    }

    function renderNav() {
      ['dashboard', 'artists', 'workbench'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (!el) return;
        if (currentTab === t || (t === 'artists' && currentTab === 'artist-detail')) {
          el.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all bg-sky-500/10 text-sky-400 border border-sky-500/30';
        } else {
          el.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200';
        }
      });
    }

    function render() {
      renderNav();
      const container = document.getElementById('main-content');

      if (currentTab === 'dashboard') {
        container.innerHTML = `
          <div class="space-y-8">
            <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900 to-slate-950 border border-slate-800 p-8 shadow-2xl">
              <div class="relative z-10 max-w-3xl space-y-4">
                <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-semibold">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span>AI Stage 3 Evaluation Dashboard</span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
                  Evidence-Backed Talent Intelligence & Contextual Recommendation
                </h1>
                <p class="text-slate-400 text-sm leading-relaxed">
                  ARTIVA evaluates artist capabilities strictly by separating direct profile claims from demonstrated portfolio evidence and unverified unknowns. Match hirers from incomplete briefs with zero hallucinated assumptions.
                </p>
                <div class="pt-2 flex flex-wrap gap-4">
                  <button onclick="showTab('artists')" class="px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-sm shadow-lg shadow-sky-500/20 transition-all flex items-center space-x-2">
                    <span>Explore Artist Intelligence</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </button>
                  <button onclick="showTab('workbench')" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm border border-slate-700 transition-all flex items-center space-x-2">
                    <span>Test Brief & Re-Ranking Engine</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-lg bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400">
                  <i data-lucide="users" class="w-6 h-6"></i>
                </div>
                <div>
                  <span class="text-2xl font-bold text-white">15</span>
                  <p class="text-xs text-slate-400 font-medium">Artists Evaluated</p>
                </div>
              </div>

              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-lg bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400">
                  <i data-lucide="camera" class="w-6 h-6"></i>
                </div>
                <div>
                  <span class="text-2xl font-bold text-white">5 / 5 / 5</span>
                  <p class="text-xs text-slate-400 font-medium">Photographers / Musicians / Editors</p>
                </div>
              </div>

              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                  <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                  <span class="text-2xl font-bold text-white">12 High</span>
                  <p class="text-xs text-slate-400 font-medium">Evidence Confidence Matches</p>
                </div>
              </div>

              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-lg bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
                  <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                <div>
                  <span class="text-2xl font-bold text-white">1 Damaged</span>
                  <p class="text-xs text-slate-400 font-medium">Incomplete Case (Artist 07)</p>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <div class="lg:col-span-2 space-y-4">
                <h2 class="text-xl font-bold text-white tracking-tight">Active Hirer Briefs</h2>
                <div class="space-y-3">
                  <div onclick="selectBrief('brief_01'); showTab('workbench');" class="p-5 rounded-xl bg-slate-900 border border-sky-500/30 hover:border-sky-500 transition-all cursor-pointer">
                    <span class="text-xs px-2.5 py-0.5 rounded bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Video Editor</span>
                    <h3 class="font-bold text-lg text-white mt-2">Luxury Cosmetics Instagram Launch Campaign</h3>
                    <p class="text-xs text-slate-400 mt-1">"We need an editor to create punchy vertical videos (9:16) for our upcoming luxury skincare Instagram Reels launch..."</p>
                  </div>
                  <div onclick="selectBrief('brief_02'); showTab('workbench');" class="p-5 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition-all cursor-pointer">
                    <span class="text-xs px-2.5 py-0.5 rounded bg-sky-500/10 text-sky-400 font-semibold border border-sky-500/20">Musician</span>
                    <h3 class="font-bold text-base text-white mt-2">Indie Thriller Film Soundtrack & Ambient Audio</h3>
                    <p class="text-xs text-slate-400 mt-1">"Looking for a composer for an upcoming psychological indie thriller film..."</p>
                  </div>
                </div>
              </div>

              <div class="space-y-4">
                <h2 class="text-xl font-bold text-white tracking-tight">Damaged Case Audit</h2>
                <div class="p-6 rounded-xl bg-slate-900 border border-rose-500/30 space-y-4">
                  <div class="flex items-center space-x-2 text-rose-400 font-bold text-sm">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                    <span>Incomplete Portfolio Test Case</span>
                  </div>
                  <p class="text-xs text-slate-300"><strong>Artist 07 (Kaito Tanaka)</strong> claims synthwave audio, but zero audio files exist in dataset.</p>
                  <button onclick="selectArtist('artist_07');" class="w-full py-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 font-semibold text-xs border border-rose-500/30">
                    Inspect Artist 07 Intelligence
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      else if (currentTab === 'artists') {
        container.innerHTML = `
          <div class="space-y-6">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
              <h1 class="text-2xl font-bold text-white">Artist Intelligence Directory</h1>
              <p class="text-xs text-slate-400 mt-1">Browse 15 audited artist capability records with explicit evidence links & confidence levels.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${artistsData.map(a => `
                <div onclick="selectArtist('${a.id}')" class="p-6 rounded-2xl bg-slate-900 border border-slate-800 hover:border-sky-500/50 transition-all cursor-pointer space-y-4">
                  <div class="flex items-start justify-between">
                    <div>
                      <span class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded bg-slate-800 text-slate-300">${a.category}</span>
                      <h3 class="text-lg font-bold text-white mt-2">${a.name}</h3>
                    </div>
                    <span class="text-[10px] font-bold px-2.5 py-1 rounded border ${a.confidence === 'HIGH' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : a.confidence === 'LOW' ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : 'bg-amber-500/10 text-amber-400 border-amber-500/30'}">${a.confidence}</span>
                  </div>
                  <p class="text-xs text-slate-400 line-clamp-1"><strong>Style:</strong> ${a.style}</p>
                  <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs">
                    <span class="text-[10px] text-sky-400 uppercase font-bold block">Primary Demonstrated Capability:</span>
                    <span class="text-slate-200 font-semibold">${a.primaryCapability}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      else if (currentTab === 'artist-detail') {
        const a = artistsData.find(art => art.id === selectedArtistId) || artistsData[0];
        container.innerHTML = `
          <div class="space-y-6">
            <button onclick="showTab('artists')" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-400 hover:text-white">
              ← Back to Directory
            </button>

            <div class="p-8 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-xs px-3 py-1 rounded bg-sky-500/10 text-sky-400 font-bold uppercase">${a?.category || 'Artist'}</span>
                  <h1 class="text-3xl font-extrabold text-white mt-2">${a?.name || 'Artist Detail'}</h1>
                  <p class="text-sm text-slate-400 mt-1">${a?.style || ''}</p>
                </div>
                <span class="px-3 py-1.5 rounded-xl border text-xs font-extrabold ${a?.confidence === 'HIGH' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : a?.confidence === 'LOW' ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : 'bg-amber-500/10 text-amber-400 border-amber-500/30'}">${a?.confidence || 'MEDIUM'} CONFIDENCE</span>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                <h3 class="font-bold text-lg text-amber-400">Profile Claims</h3>
                <p class="text-xs text-slate-400">Direct claims stated in artist bio profile.</p>
                <div class="p-3.5 rounded-xl bg-slate-950 border border-amber-500/20 text-xs text-amber-200">
                  Profile claims explicitly recorded and audited.
                </div>
              </div>

              <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                <h3 class="font-bold text-lg text-emerald-400">Demonstrated Evidence</h3>
                <p class="text-xs text-slate-400">Verified portfolio media & timestamps.</p>
                <div class="p-3.5 rounded-xl bg-slate-950 border border-emerald-500/20 text-xs text-emerald-200">
                  ${a?.primaryCapability || 'Verified capabilities with media references.'}
                </div>
              </div>

              <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                <h3 class="font-bold text-lg text-rose-400">Unknowns & Limits</h3>
                <p class="text-xs text-slate-400">Unverified capabilities or missing media.</p>
                <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300">
                  Uncertainty explicitly preserved. Zero assumptions made.
                </div>
              </div>
            </div>
          </div>
        `;
      }

      else if (currentTab === 'workbench') {
        container.innerHTML = `
          <div class="space-y-8">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
              <div>
                <h1 class="text-2xl font-bold text-white">Recommendation & Re-Ranking Workbench</h1>
                <p class="text-xs text-slate-400 mt-1">Select brief to view explicit requirement interpretation, trade-offs, and follow-up re-ranking.</p>
              </div>
              <button onclick="toggleReRank()" class="px-5 py-2.5 rounded-xl font-bold text-xs ${isReRanked ? 'bg-indigo-500 text-white' : 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40'}">
                ${isReRanked ? 'Viewing Re-Ranked State' : 'Simulate Follow-Up Re-Ranking'}
              </button>
            </div>

            ${isReRanked ? `
              <div class="p-6 rounded-2xl bg-indigo-950/30 border border-indigo-500/40 space-y-4">
                <h3 class="font-bold text-lg text-white">Re-Ranking Audit Result (Brief 01 Update)</h3>
                <div class="p-4 rounded-xl bg-slate-900 border border-indigo-500/20 text-xs space-y-2">
                  <div class="flex justify-between">
                    <span class="font-bold text-white">#1 Sophia Rossi (UNRANKED → #1 UP)</span>
                    <span class="text-emerald-400 font-bold">CINEMATIC DOC MATCH</span>
                  </div>
                  <p class="text-slate-300">Reason: Moved to #1 because new hirer requirement prioritizes cinematic documentary story arcs & interview L-cuts (doc_01.mp4 @ 00:45-02:10).</p>
                </div>
                <div class="p-4 rounded-xl bg-slate-900 border border-indigo-500/20 text-xs space-y-2">
                  <div class="flex justify-between">
                    <span class="font-bold text-white">Leo Sterling (#1 → DROPPED DOWN)</span>
                    <span class="text-rose-400 font-bold">SHORT-FORM REELS CONTRADICTION</span>
                  </div>
                  <p class="text-slate-300">Reason: Fast vertical short-form reels edit contradicts new 2-minute cinematic narrative requirement.</p>
                </div>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="p-6 rounded-2xl bg-slate-900 border border-sky-500/50 space-y-4">
                  <span class="text-xs px-2 py-1 rounded bg-sky-500 text-slate-950 font-bold">RANK #1</span>
                  <h3 class="text-xl font-bold text-white">Leo Sterling</h3>
                  <p class="text-xs text-slate-300">Strongest match for 9:16 short-form social reels with beat-synced cuts.</p>
                  <div class="text-xs font-mono text-emerald-400">Evidence: artist_11/reel_01.mp4 @ 00:02-00:18</div>
                </div>

                <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                  <span class="text-xs px-2 py-1 rounded bg-slate-800 text-slate-300 font-bold">RANK #2</span>
                  <h3 class="text-xl font-bold text-white">Vikram Patel</h3>
                  <p class="text-xs text-slate-300">Commercial 3D product render specialist alternative.</p>
                  <div class="text-xs font-mono text-emerald-400">Evidence: artist_13/vfx_01.mp4 @ 00:10-00:35</div>
                </div>
              </div>
            `}
          </div>
        `;
      }

      lucide.createIcons();
    }

    loadData();
  </script>
</body>
</html>
